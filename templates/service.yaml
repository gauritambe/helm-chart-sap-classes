apiVersion: v1
kind: Service
metadata:
  name: {{ include "sap-classes.name" . }}
  namespace: {{ include "sap-classes.namespace" . }}
  labels:
    {{- include "sap-classes.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sap-classes.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
